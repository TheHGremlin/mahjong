<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahjong</title>
  <meta name="description" content="A no-frills Mahjong solitaire with fantasy picture tiles.">
  <meta name="theme-color" content="#0a1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mahjong">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mahjong</h1>

    <div class="stats">
      <div class="stat"><span class="stat-label">Game</span><span id="st-game">—</span></div>
      <div class="stat"><span class="stat-label">Tiles</span><span id="st-tiles">144</span></div>
      <div class="stat"><span class="stat-label">Score</span><span id="st-score">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span id="st-time">0:00</span></div>
    </div>

    <nav class="actions">
      <!-- .ic is the compact label used on phones; .label is the full one -->
      <button id="btn-undo" title="Take back the last pair (Ctrl+Z)" aria-label="Undo"><span class="ic" aria-hidden="true">↶</span><span class="label">Undo</span></button>
      <button id="btn-hint" title="Show a matching pair (H) — costs points" aria-label="Hint"><span class="ic" aria-hidden="true">💡</span><span class="label">Hint</span></button>
      <button id="btn-restart" title="Start this game over" aria-label="Restart"><span class="ic" aria-hidden="true">↻</span><span class="label">Restart</span></button>
      <button id="btn-select" title="Play a specific game number" aria-label="Choose game number"><span class="ic" aria-hidden="true">#</span><span class="label">Game #</span></button>
      <button id="btn-new" class="primary" title="New game (N)" aria-label="New game"><span class="ic" aria-hidden="true">New</span><span class="label">New Game</span></button>
      <button id="btn-mute" class="icon" aria-label="Sound"></button>
      <button id="btn-help" class="icon" title="How to play" aria-label="How to play">?</button>
    </nav>
  </header>

  <main id="stage">
    <div id="board"></div>
    <div id="rotate-tip">
      <span>Turn your phone sideways for bigger tiles</span>
      <button id="rotate-tip-close" class="icon" aria-label="Dismiss tip">✕</button>
    </div>
  </main>

  <div id="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title"></h2>
      <div class="dialog-body" id="dlg-body"></div>
      <div class="dialog-buttons" id="dlg-buttons"></div>
    </div>
  </div>

  <script src="tiles.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
